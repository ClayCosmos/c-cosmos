apiVersion: apps/v1
kind: Deployment
metadata:
  name: claycosmos-redis
  labels:
    app.kubernetes.io/name: claycosmos
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: claycosmos
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: claycosmos
        app.kubernetes.io/component: redis
    spec:
      nodeSelector:
        # Provider-managed label auto-applied by Rackspace NGPC to on-demand
        # (non-spot) nodes; survives node cycling. The previous manual
        # `nodepool: ondemand` label was dropped after a node rotation, leaving
        # this pod unschedulable.
        servers.ngpc.rxt.io/type: ondemand
      containers:
        - name: redis
          # Pull from the AWS ECR Public mirror of the Docker official image to
          # avoid Docker Hub anonymous pull rate limits (HTTP 429). containerd
          # fetches an anonymous token automatically; no imagePullSecret needed.
          image: public.ecr.aws/docker/library/redis:7-alpine
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: redis-data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 999
            capabilities:
              drop:
                - ALL
      volumes:
        - name: redis-data
          emptyDir: {}
